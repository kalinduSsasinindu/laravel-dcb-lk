name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # orchestra/testbench's major has to match the laravel/framework
          # major it pulls in - leaving it as the wide-open composer.json
          # range (^8.0|^9.0|^10.0) lets Composer pick e.g. testbench v10
          # (-> laravel/framework v12) on a job that just required
          # illuminate/support 10.*, which conflicts (laravel/framework
          # replaces illuminate/support, they can't coexist).
          - php: 8.2
            laravel: "10.*"
            testbench: "^8.0"
          - php: 8.3
            laravel: "10.*"
            testbench: "^8.0"
          - php: 8.2
            laravel: "11.*"
            testbench: "^9.0"
          - php: 8.3
            laravel: "11.*"
            testbench: "^9.0"
          - php: 8.4
            laravel: "11.*"
            testbench: "^9.0"
          - php: 8.2
            laravel: "12.*"
            testbench: "^10.0"
          - php: 8.3
            laravel: "12.*"
            testbench: "^10.0"
          - php: 8.4
            laravel: "12.*"
            testbench: "^10.0"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
